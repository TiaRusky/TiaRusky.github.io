<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000510">
  <title>Knowledge | TiaRuskii</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/knowledge.css?v=4">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="app" class="app">
    <header class="topbar">
      <button id="rail-toggle" class="rail-toggle" type="button" aria-expanded="false" aria-controls="rail" aria-label="Toggle navigation">
        <span class="rail-toggle-bar"></span><span class="rail-toggle-bar"></span><span class="rail-toggle-bar"></span>
      </button>
      <a class="brand" href="#/" aria-label="Knowledge home">
        <span class="brand-mark">K</span>
        <span class="brand-name">KNOWLEDGE</span>
      </a>
      <button id="search-trigger" class="search-trigger" type="button" aria-haspopup="dialog">
        <span class="search-trigger-icon" aria-hidden="true">⌕</span>
        <span class="search-trigger-text">Search the archive…</span>
        <kbd class="search-trigger-kbd">Ctrl K</kbd>
      </button>
    </header>

    <div class="layout">
      <nav id="rail" class="rail" aria-label="Knowledge navigation">
        <div class="rail-group">
          <p class="rail-label">Explore</p>
          <a class="rail-link" href="#/all" data-count="all">All Knowledge</a>
          <a class="rail-link" href="#/domains" data-count="domains">Domains</a>
          <a class="rail-link" href="#/topics" data-count="topics">Topics</a>
          <a class="rail-link" href="#/tools" data-count="tools">Tools</a>
        </div>
        <div class="rail-group">
          <p class="rail-label">Recent</p>
          <div id="rail-recents" class="rail-recents"></div>
        </div>
        <p class="rail-foot">The repository is the memory.<br>This is the interface.</p>
      </nav>

      <button id="rail-backdrop" class="rail-backdrop" type="button" tabindex="-1" aria-hidden="true"></button>

      <main id="main" class="main" tabindex="-1" aria-live="polite"></main>

      <aside id="toc-rail" class="toc-rail" aria-label="Table of contents">
        <div class="toc-sticky">
          <p class="toc-label">Contents</p>
          <nav id="toc" class="toc"></nav>
        </div>
      </aside>
    </div>
  </div>

  <!-- Command palette -->
  <div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="Search knowledge" hidden>
    <div class="palette-inner">
      <div class="palette-input-row">
        <span class="palette-search-icon" aria-hidden="true">⌕</span>
        <input id="palette-input" type="text" placeholder="Search titles, tools, event IDs, commands…"
               autocomplete="off" spellcheck="false" aria-label="Search query">
        <kbd class="palette-esc">ESC</kbd>
      </div>
      <div id="palette-results" class="palette-results" role="listbox" aria-label="Search results"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Wiki-link preview -->
  <div id="preview" class="preview" hidden></div>

  <button id="exit-btn" class="exit-btn" type="button" title="Return to terminal">EXIT [ESC]</button>

  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000510;color:#00e5ff;font-family:monospace;text-align:center;padding:2rem;z-index:99999;">
      <p>JavaScript is required to use the Knowledge archive.</p>
    </div>
  </noscript>

  <script type="module" src="assets/knowledge.js?v=4"></script>
</body>
</html>
