    - title: "Fondamenti di networking"
      slug: "networking-basics"
      content: |
        ## Fondamenti di Networking

        ### Modello OSI

        1. **Physical** - Cavi, segnali elettrici
        2. **Data Link** - MAC address, switching
        3. **Network** - IP, routing
        4. **Transport** - TCP/UDP, porte
        5. **Session** - Gestione sessioni
        6. **Presentation** - Formato dati
        7. **Application** - HTTP, DNS, FTP

        ### TCP vs UDP

        | TCP | UDP |
        |-----|-----|
        | Connection-oriented | Connectionless |
        | Affidabile | Non affidabile |
        | 3-way handshake | Nessun handshake |
        | Flow control | No flow control |
