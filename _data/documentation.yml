    - title: "Introduzione alla DFIR"
      slug: "intro-dfir"
      content: |
        ## Introduzione alla DFIR

        La **DFIR** (Digital Forensics & Incident Response) è l'insieme delle
        tecniche e metodologie per investigare incidenti informatici e
        raccogliere prove digitali.

        ### Fasi della DFIR

        1. **Identificazione**: Riconoscere che un incidente è in corso
        2. **Contenimento**: Limitare i danni e prevenire la diffusione
        3. **Eradicazione**: Rimuovere la minaccia dal sistema
        4. **Ripristino**: Tornare allo stato operativo normale
        5. **Lezioni apprese**: Documentare e migliorare

        ### Tool comuni

        - **Volatility**: Analisi della memoria RAM
        - **Autopsy/Sleuth Kit**: Analisi forense del filesystem
        - **Wireshark**: Analisi del traffico di rete
        - **FTK Imager**: Acquisizione di immagini forensi

    - title: "Analisi di memory dump"
      slug: "memory-dump-analysis"
      content: |
        ## Analisi di Memory Dump

        L'analisi della memoria volatile (RAM) è cruciale nella DFIR perché
        molti artefatti esistono solo in memoria.

        ### Concetti chiave

        - **Processi in esecuzione**: Malware spesso si nasconde come processo
        - **Connessioni di rete**: Socket attive, porte in ascolto
        - **Registry in memoria**: Chiavi di registro caricate
        - **Stringhe in memoria**: Password, chiavi, comandi

        ### Volatility - Comandi base

        ```
        # Identificare il profilo
        volatility -f dump.raw imageinfo

        # Elencare processi
        volatility -f dump.raw --profile=Win10x64 pslist

        # Connessioni di rete
        volatility -f dump.raw --profile=Win10x64 netscan

        # Dump di un processo
        volatility -f dump.raw --profile=Win10x64 memdump -p PID -D out/
        ```

    - title: "Artefatti Windows forensi"
      slug: "windows-artifacts"
      content: |
        ## Artefatti Windows Forensi

        ### Registry

        - **SAM**: Hash delle password utente
        - **SYSTEM**: Chiavi di sistema, configurazioni
        - **SOFTWARE**: Software installato, versioni
        - **NTUSER.DAT**: Configurazioni utente

        ### File system

        - **$MFT**: Master File Table (NTFS)
        - **USN Journal**: Journal delle modifiche
        - **Prefetch**: File di prefetch delle applicazioni
        - **Event Logs**: Log di sistema (.evtx)

        ### Browser Artifacts

        - History
        - Cookies
        - Cache
        - Download

