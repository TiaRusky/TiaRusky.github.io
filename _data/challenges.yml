    ## Bumblebee — HTB Sherlock

    **Piattaforma:** Hack The Box
    **Categoria:** DFIR
    **Difficoltà:** Medium
    **Data:** Giugno 2026

    ### Scenario

    Investigazione su un attacco ransomware in un ambiente Active Directory.

    ### Analisi

    #### Step 1: Timeline

    Ricostruzione della timeline degli eventi tramite Windows Event Logs.

    #### Step 2: Lateral movement

    Identificato movimento laterale via WMI e PsExec.

    #### Step 3: Ransomware deployment

    Il ransomware è stato distribuito tramite GPO compromesso.

    ### IOCs

    - MD5: `a1b2c3d4e5f6...`
    - C2: `10.10.14[.]50:8443`
    - Registry key: `HKLM\...\Run\Updater`

