    ## Campfire-1 — HTB Sherlock

    **Piattaforma:** Hack The Box
    **Categoria:** DFIR
    **Difficoltà:** Easy
    **Data:** Giugno 2026

    ### Scenario

    Un'azienda sospetta un'intrusione nella propria rete. Ci viene fornito
    un dump della memoria e alcuni log di sistema.

    ### Analisi

    #### Step 1: Identificazione del profilo

    ```
    volatility -f campfire.raw imageinfo
    ```
    Profilo identificato: **Win10x64_19041**

    #### Step 2: Processi sospetti

    ```
    volatility -f campfire.raw --profile=Win10x64_19041 pslist
    ```
    Trovato processo sospetto: `svch0st.exe` (PID 4528) — nome simile a
    `svchost.exe` per mimetizzarsi.

    #### Step 3: Analisi del malware

    ```
    volatility -f campfire.raw --profile=Win10x64_19041 malfind -p 4528
    ```
    Rilevata iniezione di codice nel processo.

    ### Conclusione

    - Il malware si mascherava da `svch0st.exe`
    - Comunicava con C2 su `192.168.1[.]100:4444`
    - Persistenza ottenuta tramite chiave di registro Run

