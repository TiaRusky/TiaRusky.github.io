<!-- About Me Window Content -->
<template id="template-about">
  <h2>👤 Chi sono</h2>
  <div class="about-section">
    <h3>Bio</h3>
    <p>{{ site.data.profile.bio }}</p>
  </div>
  <div class="about-section">
    <h3>📍 Location</h3>
    <p>{{ site.data.profile.location }}</p>
  </div>
  <div class="about-section">
    <h3>🎯 Obiettivi</h3>
    <p>{{ site.data.profile.goals }}</p>
  </div>
  <div class="about-section">
    <h3>🛠️ Skills in crescita</h3>
    <div id="skills-container">
      {% for skill in site.data.profile.skills %}
      <span class="skill-tag">{{ skill }}</span>
      {% endfor %}
    </div>
  </div>
  <div class="about-section">
    <h3>🔗 Links</h3>
    <ul>
      {% for link in site.data.profile.links %}
      <li><a href="{{ link.url }}" target="_blank">{{ link.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
  <div class="about-section">
    <h3>📚 Piattaforme</h3>
    <ul>
      {% for platform in site.data.profile.platforms %}
      <li><strong>{{ platform.name }}</strong>: {{ platform.username }}</li>
      {% endfor %}
    </ul>
  </div>
</template>
