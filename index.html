<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000510">
  <title>TiaRuskii | Linux Terminal Portfolio</title>
  <link rel="stylesheet" href="assets/css/terminal.css?v=11">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐧%3C/text%3E%3C/svg%3E">
</head>
<body>
  <noscript>
    <div style="position:fixed; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; background:#000510; color:#00e5ff; font-family:'Courier New', monospace; text-align:center; padding:2rem; z-index:9999;">
      <p>JavaScript is required to use this interactive terminal.<br>Please enable JavaScript in your browser.</p>
    </div>
  </noscript>

  <canvas id="space-bg" aria-hidden="true"></canvas>

  <div id="boot-screen" class="boot-screen" aria-live="polite">
    <div class="boot-content">
      <div id="boot-text" class="boot-text"></div>
      <div id="boot-bar" class="boot-bar" aria-hidden="true"></div>
    </div>
  </div>

  <div class="window-wrapper">
    <div class="window-header" aria-hidden="true">
      <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="window-title">user@tiaruskii:~</span>
    </div>

    <main id="terminal" role="log" aria-live="polite" aria-label="Terminale Linux interattivo">
      <div id="output" class="output"></div>
      <div id="input-line" class="input-line">
        <span class="prompt" id="prompt" aria-hidden="true">user@tiaruskii:~$</span>
        <span id="typed-text" class="typed-text"></span><span class="cursor" aria-hidden="true">_</span>
      </div>
      <label for="hidden-input" class="sr-only">Input terminale</label>
      <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>

      <div id="train-container" class="train-container" aria-hidden="true"></div>
    </main>
  </div>

  <!-- SOCGraph full-screen overlay -->
  <div id="app-overlay" class="app-overlay hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="SOCGraph forensic tool">
    <div class="app-overlay-scanlines"></div>
    <div class="app-overlay-crt-vignette"></div>
    <div id="app-overlay-boot" class="app-overlay-boot">
      <div class="app-boot-terminal">
        <div id="app-boot-text" class="app-boot-text">SOCGraph OS v1.0</div>
        <div id="app-boot-bar" class="app-boot-bar">[                    ] 0%</div>
      </div>
    </div>
    <button id="app-close-btn" class="app-close-btn" aria-label="Close SOCGraph and return to terminal">EXIT [ESC]</button>
    <iframe id="app-frame" class="app-frame hidden" src="" title="SOCGraph Application" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>
  </div>

  <script src="assets/js/terminal.js?v=11"></script>
</body>
</html>
